    <!-- Lightbox -->
    <div class="ww-lightbox" id="wwLightbox">
        <button class="ww-close" id="wwClose" aria-label="Close">&times;</button>
        <button class="ww-nav ww-prev" id="wwPrev" aria-label="Previous">&#8249;</button>
        <img id="wwLightboxImg" src="" alt="">
        <button class="ww-nav ww-next" id="wwNext" aria-label="Next">&#8250;</button>
    </div>

    <script>
        (function () {
            var thumbs = Array.prototype.slice.call(document.querySelectorAll('.ww-grid img'));
            var box = document.getElementById('wwLightbox');
            var boxImg = document.getElementById('wwLightboxImg');
            var current = 0;

            function show(i) {
                current = (i + thumbs.length) % thumbs.length;
                boxImg.src = thumbs[current].src;
            }

            function open(i) {
                show(i);
                box.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function close() {
                box.classList.remove('open');
                document.body.style.overflow = '';
            }

            thumbs.forEach(function (img, i) {
                img.addEventListener('click', function () { open(i); });
            });

            document.getElementById('wwPrev').addEventListener('click', function (e) {
                e.stopPropagation();
                show(current - 1);
            });
            document.getElementById('wwNext').addEventListener('click', function (e) {
                e.stopPropagation();
                show(current + 1);
            });
            document.getElementById('wwClose').addEventListener('click', close);

            // Click outside the image closes
            box.addEventListener('click', function (e) {
                if (e.target === box) close();
            });

            // Keyboard: arrows + escape
            document.addEventListener('keydown', function (e) {
                if (!box.classList.contains('open')) return;
                if (e.key === 'Escape') close();
                else if (e.key === 'ArrowLeft') show(current - 1);
                else if (e.key === 'ArrowRight') show(current + 1);
            });
        })();
    </script>
